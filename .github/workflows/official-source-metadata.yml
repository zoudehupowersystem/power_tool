name: One-time README line-ending restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-source-metadata.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original CRLF line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('README.md', 'README_zh.md'):
              p = Path(name)
              data = p.read_bytes()
              text = data.decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
              p.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Commit line-ending restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README_zh.md
          git commit -m 'Preserve PowerTool README line endings'
          git push
